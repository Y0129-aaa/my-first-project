<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="微信二维码占位图">
  <defs>
    <!-- 用一组小方块平铺出二维码的质感（纯占位，不可扫描） -->
    <pattern id="qr-modules" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="6" height="6" rx="1" fill="#111827" />
      <rect x="8" y="5" width="5" height="5" rx="1" fill="#111827" />
      <rect x="3" y="10" width="4" height="4" rx="1" fill="#111827" />
      <rect x="10" y="11" width="3" height="3" rx="1" fill="#111827" />
    </pattern>
  </defs>

  <rect width="120" height="120" rx="10" fill="#ffffff" />
  <rect x="4" y="4" width="112" height="112" rx="8" fill="url(#qr-modules)" opacity="0.9" />

  <!-- 三个定位角 -->
  <g fill="#111827">
    <rect x="8" y="8" width="22" height="22" rx="3" />
    <rect x="90" y="8" width="22" height="22" rx="3" />
    <rect x="8" y="90" width="22" height="22" rx="3" />
  </g>
  <g fill="#ffffff">
    <rect x="11" y="11" width="16" height="16" rx="2" />
    <rect x="93" y="11" width="16" height="16" rx="2" />
    <rect x="11" y="93" width="16" height="16" rx="2" />
  </g>
  <g fill="#111827">
    <rect x="14" y="14" width="10" height="10" rx="1.5" />
    <rect x="96" y="14" width="10" height="10" rx="1.5" />
    <rect x="14" y="96" width="10" height="10" rx="1.5" />
  </g>

  <!-- 中间微信绿底 -->
  <rect x="44" y="44" width="32" height="32" rx="8" fill="#ffffff" />
  <rect x="46" y="46" width="28" height="28" rx="7" fill="#07c160" />
  <text x="60" y="66" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#ffffff">微</text>
</svg>
