<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>测试页面</title>
  <style>
    body {
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
      font-family: sans-serif;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .container {
      text-align: center;
      padding: 2rem;
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }
    h1 { font-size: 3rem; margin-bottom: 1rem; }
    p { font-size: 1.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1> AI学习工作台</h1>
    <p>如果你看到这个页面，说明浏览器正常工作！</p>
    <p style="margin-top: 2rem;">
      <a href="/buyer" style="color: white; background: rgba(255,255,255,0.3); padding: 10px 20px; border-radius: 10px; text-decoration: none;">
        进入买家页面 →
      </a>
    </p>
  </div>
</body>
</html>
