<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320" role="img" aria-label="带满屏水印的预览版占位图">
  <defs>
    <!-- 斜向平铺的满屏水印 -->
    <pattern id="watermark" width="150" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <text x="0" y="16" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#111827" opacity="0.13">预览版 · 瑞子的笔记小铺</text>
    </pattern>
  </defs>

  <!-- 纸张 -->
  <rect width="240" height="320" rx="6" fill="#ffffff" />

  <!-- 标题 -->
  <rect x="24" y="30" width="150" height="12" rx="3" fill="#374151" />
  <rect x="24" y="50" width="96" height="8" rx="3" fill="#9ca3af" />
  <rect x="24" y="68" width="192" height="2" rx="1" fill="#e5e7eb" />

  <!-- 正文行（模拟笔记排版） -->
  <g fill="#d1d5db">
    <rect x="24" y="88" width="192" height="7" rx="3" />
    <rect x="24" y="106" width="176" height="7" rx="3" />
    <rect x="24" y="124" width="188" height="7" rx="3" />
    <rect x="24" y="142" width="120" height="7" rx="3" />

    <rect x="24" y="172" width="60" height="9" rx="3" fill="#6b7280" />
    <rect x="24" y="194" width="184" height="7" rx="3" />
    <rect x="24" y="212" width="160" height="7" rx="3" />

    <!-- 公式块 -->
    <rect x="60" y="238" width="120" height="26" rx="4" fill="#f3f4f6" />
    <rect x="72" y="248" width="96" height="6" rx="3" fill="#9ca3af" />

    <rect x="24" y="280" width="170" height="7" rx="3" />
  </g>

  <!-- 满屏水印盖在最上层 -->
  <rect width="240" height="320" rx="6" fill="url(#watermark)" />

  <!-- 边框 -->
  <rect x="0.5" y="0.5" width="239" height="319" rx="6" fill="none" stroke="#e5e7eb" />
</svg>
